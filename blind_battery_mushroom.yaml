# ================================================================================
# EVE MOTION BLINDS BATTERY PANEL - MUSHROOM TEMPLATE STYLE
# 2-column layout with device name, battery %, and last update
# Icon color: Green (≥70%) | Yellow (≥40%) | Red (<40%)
# ================================================================================

type: grid
title: Eve Blind Batteries
columns: 2
square: false
cards:
  # backyard blind 1
  - type: custom:mushroom-template-card
    entity: sensor.backyard_blind_1_battery
    icon: |
      {% set battery = states('sensor.backyard_blind_1_battery') | float(0) %}
      {% if battery >= 90 %}mdi:battery
      {% elif battery >= 70 %}mdi:battery-high
      {% elif battery >= 40 %}mdi:battery-medium
      {% elif battery >= 20 %}mdi:battery-low
      {% else %}mdi:battery-alert
      {% endif %}
    icon_color: |
      {% set battery = states('sensor.backyard_blind_1_battery') | float(0) %}
      {% if battery >= 70 %}green
      {% elif battery >= 40 %}amber
      {% else %}red
      {% endif %}
    primary: Backyard Blind 1
    secondary: 🔋 {{ states('sensor.backyard_blind_1_battery') | default('—') }}% | ⏱️ {{ relative_time(states.sensor.backyard_blind_1_battery.last_changed) }}
    layout: horizontal
    multiline_secondary: false
    fill_container: false
    tap_action:
      action: more-info

