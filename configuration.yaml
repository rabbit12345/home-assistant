command_line:
  - sensor:
      name: Costco Auburn P98
      unique_id: costco_auburn_p98
      scan_interval: 3600
      command: >-
        curl -s -L --compressed
        -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
        -H "Accept-Language: en-AU,en;q=0.9"
        -H "Accept-Encoding: gzip, deflate, br"
        "https://fuelradar.com.au/map/station/437aa5eea143da5dd19defc3"
        | python3 -c "import sys,json,re;html=sys.stdin.read();m=re.search(r'data-page=\"(.*?)\"',html);data=json.loads(m.group(1).replace('&quot;','\"')) if m else {};prices=data.get('props',{}).get('stationData',{}).get('Prices',[]);p98=next((p for p in prices if p['Code']=='P98'),None);print(p98['Price']/10 if p98 else '')"
      unit_of_measurement: "c/L"

