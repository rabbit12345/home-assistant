sql:
  - name: "Power Hourly Average 3-9"
    unique_id: power_average_hourly_3to9
    db_url: sqlite:////config/home-assistant_v2.db
    query: >
      SELECT
        ROUND(
          SUM(delta_kwh) / 42.0,
          3
        ) AS state
      FROM (
        SELECT
          s.state,
          s.last_updated_ts,
          CAST(s.state AS FLOAT) - LAG(CAST(s.state AS FLOAT))
            OVER (PARTITION BY s.metadata_id ORDER BY s.last_updated_ts) AS delta_kwh,
          CAST(
            strftime('%H', datetime(s.last_updated_ts, 'unixepoch', '+10 hours'))
          AS INTEGER) AS local_hour,
          DATE(datetime(s.last_updated_ts, 'unixepoch', '+10 hours')) AS local_date
        FROM states s
        INNER JOIN states_meta sm
          ON s.metadata_id = sm.metadata_id
        WHERE
          sm.entity_id = 'sensor.house_energy_consumption_today'
          AND s.last_updated_ts >= unixepoch('now', '-30 days')
          AND s.state NOT IN ('unavailable', 'unknown', '')
          AND CAST(s.state AS FLOAT) >= 0
      ) AS sub
      WHERE
        local_hour >= 15
        AND local_hour < 21
        AND local_date >= DATE(datetime(unixepoch('now', '+10 hours', '-30 days'), 'unixepoch'))
        AND local_date < DATE(datetime(unixepoch('now'), 'unixepoch', '+10 hours'))
        AND delta_kwh > 0
        AND delta_kwh < 50
    column: "state"
    unit_of_measurement: "kWh"
    device_class: energy

sensor:      
  - platform: integration
    name: Energy Solar Production
    unique_id: energy_solar_production_id
    source: sensor.envoy_pv_power
    unit_time: h
    unit_prefix: k
    method: left

  - platform: integration
    name: Energy House Consumption
    unique_id: energy_house_consumption_id
    source: sensor.solix_home_demand_2
    unit_time: h
    unit_prefix: k
    method: left

  - platform: rest
    name: 'Piano Room Switchbot Curtains Position'
    unique_id: "piano_room_switchbot_curtains_position_id"
    resource: !secret switchbot_curtain1_status_url
    method: GET
    scan_interval: 600
    headers:
      Authorization: !secret switchbot_api
      Content-Type: 'application/json'
    value_template: '{{ value_json.body.slidePosition }}'
    json_attributes_path: "$.body"
    json_attributes:
      - deviceId
      - deviceType
      - hubDeviceId
      - calibrate
      - group
      - moving
      - slidePosition

  - platform: rest
    scan_interval: 10
    username: !secret fibaro_user
    password: !secret fibaro_password
    authentication: basic
    resource: "http://10.0.1.115/api/globalVariables/sendPushover"
    name: fibaro_pushover_state
    value_template: '{{ value_json.value }}'


  # Statistics: average daily solar over last N days - Set max_age to 7 days
  - platform: statistics
    name: "solar energy daily avg 7 days"
    entity_id: sensor.envoy_122206102804_energy_production_today
    state_characteristic: mean
    max_age:
      days: 7

  # Statistics: average house power over last 60 minutes
  - platform: statistics
    name: "house power avg 60m"
    entity_id: sensor.x1_h8k_host_home_demand
    state_characteristic: mean
    max_age:
      minutes: 1
      
  # AUBURN COSTCO petrol price - disabled: site migrated from Inertia (data-page) to Next.js (__NEXT_DATA__), use command_line sensors below

