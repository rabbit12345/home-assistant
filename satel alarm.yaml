# vertical-stack, not layout-card/masonry: masonry sizes each child from
# getCardSize(), and the 8-tile grid over-reports its height, which left a
# dead band between the last tile row and the history card. A vertical-stack
# lays out in real DOM flow, so there is nothing to mis-estimate.
type: vertical-stack
cards:
  - type: custom:mushroom-template-card
    entity: alarm_control_panel.house
    primary: |
      ARM status - {{ states(entity).replace('_',' ').upper() }}
    secondary: >
      updated {{ (as_timestamp(now()) -
      as_timestamp(states.alarm_control_panel.house.last_changed |
      default(0)) | int ) | timestamp_custom("%Hh %Mm", false)}} ago
    icon: >
      {{"mdi:alarm-light" if states(entity)=="disarmed" else
      "mdi:alarm-light-outline"}}
    icon_color: |
      {% set alarm_state=states(entity) %}
      {% if alarm_state=='disarmed' %}
      green
      {% elif alarm_state in ['arming','pending'] %}
      orange
      {% else %}
      red
      {% endif %}
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    multiline_secondary: false
  - type: grid
    square: false
    columns: 2
    cards:
      - type: custom:mushroom-template-card
        primary: Day ARM/DISARM
        secondary: |
          {{relative_time(states.switch.day_arm_disarm.last_changed)}}
        entity: switch.day_arm_disarm
        icon: mdi:security
        icon_color: |
          {% set alarm_state=states('alarm_control_panel.house') %}
          {% if alarm_state=='disarmed' %}
          green
          {% else %}
          red
          {% endif %}
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        multiline_secondary: false
      - type: custom:mushroom-template-card
        primary: Night ARM/DISARM
        secondary: |
          {{relative_time(states.switch.night_arm_disarm.last_changed)}}
        entity: switch.night_arm_disarm
        icon: mdi:weather-night
        icon_color: |
          {% set alarm_state=states('alarm_control_panel.house') %}
          {% if alarm_state=='disarmed' %}
          green
          {% else %}
          red
          {% endif %}
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        multiline_secondary: false
      - type: custom:mushroom-template-card
        primary: Clear Alarm
        secondary: |
          {{relative_time(states.switch.clear_alarm.last_changed)}}
        entity: switch.clear_alarm
        icon: mdi:bell-off
        icon_color: |
          {% set alarm_state=states('alarm_control_panel.house') %}
          {% if alarm_state=='triggered' %}
          red
          {% else %}
          green
          {% endif %}
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        multiline_secondary: false
      - type: custom:mushroom-template-card
        primary: Sirens
        secondary: >
          {% if is_state('binary_sensor.external_siren','on') or
          is_state('binary_sensor.internal_siren','on') %}
          SOUNDING
          {% else %}
          idle
          {% endif %}
        entity: binary_sensor.external_siren
        icon: mdi:bullhorn
        icon_color: |
          {% if is_state('binary_sensor.external_siren','on') or
          is_state('binary_sensor.internal_siren','on') %}
          red
          {% else %}
          grey
          {% endif %}
        tap_action:
          action: more-info
        hold_action:
          action: more-info
        multiline_secondary: false
      - type: custom:mushroom-template-card
        primary: PANIC
        secondary: >
          {% if is_state('binary_sensor.panic','on') %}
          TRIGGERED - keyfob
          {% elif is_state('binary_sensor.sw_panic','on') %}
          TRIGGERED - HA
          {% else %}
          hold to trigger
          {% endif %}
        entity: binary_sensor.panic
        icon: mdi:bell-alert
        icon_color: >
          {% if is_state('binary_sensor.panic','on') or
          is_state('binary_sensor.sw_panic','on') %}
          red
          {% else %}
          grey
          {% endif %}
        tap_action:
          action: none
        hold_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.panic_alarm
          confirmation:
            text: Trigger the PANIC alarm? This will sound the sirens.
        multiline_secondary: false
      # The zone list is DISCOVERED, not hardcoded. integration_entities()
      # returns everything the satel_integra config entry owns; zone subentries
      # carry a motion/occupancy device class, output subentries do not, which
      # is what separates them. Add a zone in HA and it appears here with no
      # edit to this card - that was the whole point of guessing entity ids
      # wrong twice.
      - type: custom:mushroom-template-card
        primary: Ready to Arm
        secondary: >
          {%- set ns = namespace(v=[]) %}
          {%- for e in integration_entities('satel_integra') %}
          {%- if e.startswith('binary_sensor.')
                 and state_attr(e,'device_class') in ['motion','occupancy']
                 and states(e) == 'on' %}
          {%- set ns.v = ns.v + [state_attr(e,'friendly_name') or e.split('.')[1]] %}
          {%- endif %}
          {%- endfor %}
          {%- if ns.v %}
          {{ ns.v | join(', ') }}
          {%- elif is_state('binary_sensor.ready_to_arm','on') %}
          ready
          {%- elif states('binary_sensor.ready_to_arm') in ['unknown','unavailable'] %}
          no detector active (panel ready status not wired - output 14)
          {%- else %}
          not ready - cause is outside the detector zones
          {%- endif %}
        entity: binary_sensor.ready_to_arm
        icon: >
          {%- set ns = namespace(v=[]) %}
          {%- for e in integration_entities('satel_integra') %}
          {%- if e.startswith('binary_sensor.')
                 and state_attr(e,'device_class') in ['motion','occupancy']
                 and states(e) == 'on' %}
          {%- set ns.v = ns.v + [state_attr(e,'friendly_name') or e.split('.')[1]] %}
          {%- endif %}
          {%- endfor %}
          {{ "mdi:shield-alert" if ns.v else
             ("mdi:shield-check" if is_state('binary_sensor.ready_to_arm','on')
              else "mdi:shield-outline") }}
        icon_color: >
          {%- set ns = namespace(v=[]) %}
          {%- for e in integration_entities('satel_integra') %}
          {%- if e.startswith('binary_sensor.')
                 and state_attr(e,'device_class') in ['motion','occupancy']
                 and states(e) == 'on' %}
          {%- set ns.v = ns.v + [state_attr(e,'friendly_name') or e.split('.')[1]] %}
          {%- endif %}
          {%- endfor %}
          {{ 'orange' if ns.v else
             ('green' if is_state('binary_sensor.ready_to_arm','on') else 'grey') }}
        tap_action:
          action: more-info
        hold_action:
          action: more-info
        multiline_secondary: true
      - type: custom:mushroom-template-card
        entity: sensor.alarm_last_trigger
        primary: >
          {% if is_state('alarm_control_panel.house','triggered') %}
          ALARM - {{ states('sensor.alarm_last_trigger') }}
          {% else %}
          Last trigger - {{ states('sensor.alarm_last_trigger') }}
          {% endif %}
        secondary: >
          {% set at = state_attr('sensor.alarm_last_trigger','at') %}
          {% if at %}
          {{ as_local(as_datetime(at)).strftime('%a %-d %b %H:%M') }}
          ({{ state_attr('sensor.alarm_last_trigger','alarm_state') | replace('_',' ') }})
          {% else %}
          no alarm recorded
          {% endif %}
        icon: mdi:shield-alert
        icon_color: >
          {% if is_state('alarm_control_panel.house','triggered') %}
          red
          {% elif states('sensor.alarm_last_trigger') not in ['unknown','unavailable'] %}
          orange
          {% else %}
          grey
          {% endif %}
        tap_action:
          action: more-info
        hold_action:
          action: more-info
        multiline_secondary: false
      # Same discovery as above. Deliberately NOT reading
      # sensor.alarm_active_zones: that only exists after a template reload,
      # and until then it reads `unknown`, which silently showed "All clear".
      - type: custom:mushroom-template-card
        entity: binary_sensor.ready_to_arm
        primary: >
          {%- set ns = namespace(v=[]) %}
          {%- for e in integration_entities('satel_integra') %}
          {%- if e.startswith('binary_sensor.')
                 and state_attr(e,'device_class') in ['motion','occupancy']
                 and states(e) == 'on' %}
          {%- set ns.v = ns.v + [state_attr(e,'friendly_name') or e.split('.')[1]] %}
          {%- endif %}
          {%- endfor %}
          {%- set n = ns.v | count %}
          {{ 'All clear' if n == 0 else
             n ~ ' zone' ~ ('' if n == 1 else 's') ~ ' active' }}
        secondary: >
          {%- set ns = namespace(v=[]) %}
          {%- for e in integration_entities('satel_integra') %}
          {%- if e.startswith('binary_sensor.')
                 and state_attr(e,'device_class') in ['motion','occupancy']
                 and states(e) == 'on' %}
          {%- set ns.v = ns.v + [state_attr(e,'friendly_name') or e.split('.')[1]] %}
          {%- endif %}
          {%- endfor %}
          {{ ns.v | join(', ') if ns.v else 'no movement' }}
        icon: mdi:motion-sensor
        icon_color: >
          {%- set ns = namespace(v=[]) %}
          {%- for e in integration_entities('satel_integra') %}
          {%- if e.startswith('binary_sensor.')
                 and state_attr(e,'device_class') in ['motion','occupancy']
                 and states(e) == 'on' %}
          {%- set ns.v = ns.v + [state_attr(e,'friendly_name') or e.split('.')[1]] %}
          {%- endif %}
          {%- endfor %}
          {{ 'orange' if ns.v else 'grey' }}
        tap_action:
          action: more-info
        multiline_secondary: true

  # History, newest first. Reads the rolling attribute on the trigger sensor,
  # which survives restarts.
  - type: markdown
    title: Alarm trigger history
    # Literal block (|), not folded (>): a folded scalar joins lines with
    # spaces, which collapses the whole table onto one line. Whitespace-control
    # tags ({%- -%}) keep the Jinja lines from rendering as blank rows.
    content: |-
      {%- set h = state_attr('sensor.alarm_last_trigger','history') or [] %}
      {%- if h | count == 0 -%}
      _No triggers recorded._
      {%- else -%}
      | When | Zone | State |
      |---|---|---|
      {%- for e in h | reverse %}
      | {{ as_local(as_datetime(e.at)).strftime('%-d %b %H:%M') }} | {{ e.name }} | {{ e.alarm_state | replace('_',' ') }} |
      {%- endfor %}
      {%- endif %}
