  - sensor:
    - default_entity_id: sensor.power_net_to_grid
      unique_id: power_net_to_grid_id
      name: Power Net To Grid
      unit_of_measurement: "W"
      state: >-
        {% set p = states('sensor.power_solar_production') | float(0) %} 
        {% set c = states('sensor.power_house_consumption') | float(0) %} 
        {% if p > c %}
          {{ (p - c) | round(1) }}
        {% else %}
          0 
        {% endif %}
      availability: >
        {{ has_value('sensor.power_solar_production')
           and has_value('sensor.power_house_consumption') }}
      
  - sensor:
    - default_entity_id: sensor.power_net_from_grid
      unique_id: power_net_from_grid_id
      name: Power Net From Grid
      unit_of_measurement: "W"
      state: >
        {% set p = states('sensor.power_solar_production') | float(0) %}
        {% set c = states('sensor.power_house_consumption') | float(0) %}
        {% if p < c %}
          {{ (c - p) | round(1) }}
        {% else %}
          0
        {% endif %}
      availability: >
        {{ has_value('sensor.power_solar_production')
           and has_value('sensor.power_house_consumption') }}

  - sensor:
    - default_entity_id: sensor.power_net_balance
      unique_id: power_net_balance_id
      name: "Power Net Balance"
      unit_of_measurement: "W"
      state: >
        {% set p = states('sensor.power_solar_production') | float(0) %}
        {% set c = states('sensor.power_house_consumption') | float(0) %}
        {{ (p - c) | round(1) }}
      availability: >
        {{ has_value('sensor.power_solar_production') and has_value('sensor.power_house_consumption') }}
  
  # battery change ETA
  - sensor:
      - name: "Battery Remaining To Full"
        unique_id: battery_remaining_to_full
        unit_of_measurement: "kWh"
        state: >
          {% set soc = states('sensor.x1_h8k_host_state_of_charge') | float(0) %}
          {% set cap_kwh = 40.0 %}
          {% set remaining = cap_kwh * (1 - (soc / 100)) %}
          {{ [remaining, 0] | max | round(1) }}

      - name: "Solar Weather Factor"
        unique_id: solar_weather_factor
        state: >
          {% set cloud = states('sensor.astroweather_backyard_cloud_cover') | float(100) %}
          {% set frac = cloud / 100 %}
          {# Non-linear attenuation: square curve #}
          {% set factor = 1 - (frac * frac) %}
          {{ [ [factor, 1] | min, 0.20 ] | max | round(2) }}

      # Non-linear fraction of today's solar that remains, based on sine-curve irradiance
      # f_remain = 1 - (1 - cos(pi*x)) / 2  where x in [0..1] is "day progress" between sunrise and sunset
      - name: "Solar Fraction Remaining"
        unique_id: solar_fraction_remaining
        state: >
          {% set sr = state_attr('sun.sun','next_rising') %}
          {% set ss = state_attr('sun.sun','next_setting') %}
          {% if sr and ss %}
            {% set now_ts = as_timestamp(now()) %}
            {% set sr_ts = as_timestamp(sr) %}
            {% set ss_ts = as_timestamp(ss) %}
            {# handle case when next_rising is tomorrow: use previous rising by subtracting 24h #}
            {% if sr_ts > now_ts %}
              {% set sr_ts = sr_ts - 86400 %}
            {% endif %}
            {% set day_len = ss_ts - sr_ts %}
            {% if day_len > 0 and now_ts >= sr_ts and now_ts <= ss_ts %}
              {% set x = (now_ts - sr_ts) / day_len %}
              {% set pi = 3.141592653589793 %}
              {% set remain = 1 - (1 - cos(pi * x)) / 2 %}
              {{ [ [remain, 1] | min, 0 ] | max | round(3) }}
            {% elif now_ts < sr_ts %}
              1
            {% else %}
              0
            {% endif %}
          {% else %}
            0
          {% endif %}

      - name: "Solar Remaining Estimate Today"
        unique_id: solar_remaining_estimate_today_kwh
        unit_of_measurement: "kWh"
        state: >
          {% set last7 = states('sensor.envoy_122206102804_energy_production_last_seven_days') | float(0) %}
          {% set avg_daily = last7 / 7 %}
          {% set frac_rem = states('sensor.solar_fraction_remaining') | float(0) %}
          {% set weather_f = states('sensor.solar_weather_factor') | float(0.65) %}
          {{ (avg_daily * frac_rem * weather_f) | round(2) }}

      - name: "Daylight Remaining Hours"
        unique_id: daylight_remaining_hours
        unit_of_measurement: "h"
        state: >
          {% set sun_state = states('sun.sun') %}
          {% set ss = state_attr('sun.sun', 'next_setting') %}
          
          {% if sun_state == 'above_horizon' and ss %}
            {% set secs = as_timestamp(ss) - as_timestamp(now()) %}
            {{ (([secs, 0] | max) / 3600) | round(2) }}
          {% else %}
            0
          {% endif %}

      - name: "House Load Remaining Until Sunset"
        unique_id: house_load_remaining_until_sunset
        unit_of_measurement: "kWh"
        state: >
          {% set p_w = states('sensor.house_power_avg_60m') | float(0) %}
          {% set h = states('sensor.daylight_remaining_hours') | float(0) %}
          {{ (p_w * h) | round(2) }}

      - name: "Net Charge Energy Available Today"
        unique_id: net_charge_energy_available_today
        unit_of_measurement: "kWh"
        state: >
          {% set solar_rem = states('sensor.solar_remaining_estimate_today') | float(0) %}
          {% set house_rem = states('sensor.house_load_remaining_until_sunset') | float(0) %}
          {{ (solar_rem - house_rem) | round(2) }}

      - name: "Battery Full Likelihood Today"
        unique_id: battery_full_likelihood_today_pct
        unit_of_measurement: "%"
        state: >
          {% set charge_power = states('sensor.x1_h8k_host_charge_power') | float(0) %}
          {% set need = states('sensor.battery_remaining_to_full') | float(0) %}
          {% set net = states('sensor.net_charge_energy_available_today') | float(0) %}
          {% set buffer = 1.10 %}

          {# If already full #}
          {% if need <= 0 %}
            100
          {% elif charge_power > 0 %}
          {# Charging is happening: treat likelihood as 100% while charging #}
            100
          {% elif net <= 0 %}
            0
          {% else %}
            {% set ratio = net / (need * buffer) %}
            {{ ([ratio * 100, 100] | min) | round(0) }}
          {% endif %}
          
        attributes:
          minutes_to_full: >
            {% set charge_power = states('sensor.x1_h8k_host_charge_power') | float(0) %}
            {% set need = states('sensor.battery_remaining_to_full') | float(0) %}
            {% if need <= 0 %}
              0
            {% elif charge_power > 0 %}
              {{ ((need / charge_power) * 60) | round(0) }}
            {% else %}
              {{ 'unknown' }}
            {% endif %}

      - name: "Battery Time To Full Hr"
        unique_id: battery_time_to_full_hours
        unit_of_measurement: "h"
        availability: >
          {% set need = states('sensor.battery_remaining_to_full') | float(0) %}
          {% set net = states('sensor.net_charge_energy_available_today') | float(0) %}
          {% set h = states('sensor.daylight_remaining_hours') | float(0) %}
          {{ need <= 0 or (net > 0 and h > 0) }}
        state: >
          {% set need = states('sensor.battery_remaining_to_full') | float(0) %}
          {% set net = states('sensor.net_charge_energy_available_today') | float(0) %}
          {% set h = states('sensor.daylight_remaining_hours') | float(0) %}
          {% if need <= 0 %}
            0
          {% else %}
            {{ (need / (net / h)) | round(2) }}
          {% endif %}

      - name: "Battery Full ETA"
        unique_id: battery_full_eta
        state: >
          {% set t = states('sensor.battery_time_to_full_hr') %}
          {% if t in ['unknown','unavailable',''] %}
            unknown
          {% else %}
            {% set hours = t | float(0) %}
            {{ (now() + timedelta(seconds=(hours*3600))) .isoformat() }}
          {% endif %}
      
  - cover:
    - default_entity_id: cover.pianoroom_switchbot_curtains
      unique_id: pianoroom_switchbot_curtains_id
      name: "Piano Room Switchbot Curtains"
      device_class: curtain
      open_cover:
        - data:
          deviceId: EC415B8BB5B2
          command: turnOn
          action: rest_command.switchbot_device_command
      close_cover:
        - data:
          deviceId: EC415B8BB5B2
          command: turnOff
          action: rest_command.switchbot_device_command
      stop_cover:
        - data:
          deviceId: EC415B8BB5B2
          command: turnOff
          action: rest_command.switchbot_device_command
      set_cover_position:
        - data:
          deviceId: EC415B8BB5B2
          command: setPosition
          parameter: 0,ff,{{position}}
          action: rest_command.switchbot_device_command
      position: '{{ states(''sensor.piano_room_switchbot_curtains_position'') }}'
        
