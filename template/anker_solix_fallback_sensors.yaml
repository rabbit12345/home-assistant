        {% if   s2  not in ['unavailable','unknown','none'] %} {{ s2 }}
        {% elif dyn not in ['unavailable','unknown','none'] %} {{ dyn }}
        {% elif ems not in ['unavailable','unknown','none'] %} {{ ems }}
        {% else %} unknown {% endif %}
      availability: >
        {{ states('sensor.solix_grid_status')     not in ['none']
        or states('sensor.solix_grid_status_dyn') not in ['none']
        or states('sensor.solix_grid_status_ems') not in ['none'] }}

    # ==========================================================================
    # GROUP B — 2-tier: ems_second (~5s) → ems (~5min)
    # ==========================================================================

