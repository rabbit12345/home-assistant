        {% elif ems not in ['unavailable','unknown','none'] %} {{ ems | int(0) }}
        {% elif ank_integration_pv not in ['unavailable','unknown','none'] %} {{ ank_integration_home | float(0) * 1000 if ank_integration_pv > ank_integration_home else 0 }}
