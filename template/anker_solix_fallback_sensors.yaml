        {% if   s2  not in ['unavailable','unknown','none'] %} {{ s2  | int(0) }}
        {% elif ems not in ['unavailable','unknown','none'] %} {{ ems | int(0) }}
        {% elif ank_integration not in ['unavailable','unknown','none'] %} {{ ank_integration | float(0) * 1000 }}
