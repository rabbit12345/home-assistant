    - name: "Solix Grid to Battery Power"
      unique_id: solix_fb_grid_to_battery_power
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: mdi:transmission-tower-import
      state: >
        {% set s2  = states('sensor.solix_grid_to_battery_power') %}
        {% set ems = states('sensor.solix_grid_to_battery_power_ems') %}
        {% set ank_integration_import = states('sensor.x1_h8k_host_grid_import') | float(0) %}
        {% set ank_integration_charge = states('sensor.x1_h8k_host_charge_power') | float(0) %}
        {% if   s2  not in ['unavailable','unknown','none'] %} {{ s2  | int(0) }}
        {% elif ems not in ['unavailable','unknown','none'] %} {{ ems | int(0) }}
        {% elif ank_integration_charge not in ['unavailable','unknown','none'] %} {{ ank_integration_charge | float(0) * 1000 if ank_integration_import > ank_integration_charge else 0}}
        {% else %} 0 {% endif %}
      availability: >
        {{ states('sensor.solix_grid_to_battery_power')     not in ['none']
        or states('sensor.solix_grid_to_battery_power_ems') not in ['none'] 
        or states('sensor.x1_h8k_host_grid_import') not in ['none'] }}


    # --------------------------------------------------------------------------
    # SOLIX BATTERY CHARGING POWER
    # Returns watts flowing INTO the battery. Always >= 0.
    #
    # Tier 1: pv_to_battery_power + grid_to_battery_power          (ems_second ~5s)
    # Tier 2: max(sp − lp − gp, 0)  energy balance estimate        (dynamic_export ~60s)
    # Tier 3: pv_to_battery_power + grid_to_battery_power          (ems ~5min)
    # --------------------------------------------------------------------------
    - name: "Solix Battery Charging Power"
      unique_id: solix_battery_charging_power
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: mdi:battery-charging-high
      availability: >
        {{
          states('sensor.solix_pv_to_battery_power')    not in ['unavailable','unknown','none']
          or states('sensor.solix_grid_to_battery_power') not in ['unavailable','unknown','none']
          or (
               states('sensor.solix_dyn_solar_power')   not in ['unavailable','unknown','none']
               and states('sensor.solix_dyn_home_demand') not in ['unavailable','unknown','none']
               and states('sensor.solix_dyn_grid_power')  not in ['unavailable','unknown','none']
             )
          or states('sensor.solix_ems_pv_to_battery_power')    not in ['unavailable','unknown','none']
          or states('sensor.solix_ems_grid_to_battery_power')   not in ['unavailable','unknown','none']
          or states('sensor.x1_h8k_host_charge_power')    not in ['unavailable','unknown','none']
        }}
      state: >
        # ── Tier 1: ems_second directional flows (~5 s) ──────────────────── #
        {% set p2b_s2 = states('sensor.solix_pv_to_battery_power')   | float(-1) %}
        {% set g2b_s2 = states('sensor.solix_grid_to_battery_power') | float(-1) %}
        {% set tier1_ok = p2b_s2 >= 0 and g2b_s2 >= 0 %}

        # ── Tier 2: dynamic_export energy balance (~60 s) ───────────────── #
        {% set solar_dyn = states('sensor.solix_dyn_solar_power')  | float(-1) %}
        {% set home_dyn  = states('sensor.solix_dyn_home_demand')  | float(-1) %}
        {% set grid_dyn  = states('sensor.solix_dyn_grid_power')   | float(-999) %}
        {% set tier2_ok  = solar_dyn >= 0 and home_dyn >= 0 and grid_dyn != -999 %}

        # ── Tier 3: ems directional flows (~5 min) ───────────────────────── #
        {% set p2b_ems = states('sensor.solix_ems_pv_to_battery_power')   | float(-1) %}
        {% set g2b_ems = states('sensor.solix_ems_grid_to_battery_power') | float(-1) %}
        {% set tier3_ok = p2b_ems >= 0 and g2b_ems >= 0 %}

        # ── Tier 4: anker integration (~5 min) ───────────────────────── #
        {% set ank_integration = states('sensor.x1_h8k_host_charge_power') | float(-1) %}
        {% set tier4_ok = ank_integration >= 0 %}

        # ── Select highest available tier ───────────────────────────────── #
        {% if tier1_ok %}
          {{ (p2b_s2 + g2b_s2) | int(0) }}
        {% elif tier2_ok %}
          {% set balance = solar_dyn - home_dyn - grid_dyn %}
          {{ [balance, 0] | max | int(0) }}
        {% elif tier3_ok %}
          {{ (p2b_ems + g2b_ems) | int(0) }}
        {% elif tier4_ok %}
          {{ ank_integration | float(0) * 1000 }}
        {% else %}
          0
        {% endif %}

    # --------------------------------------------------------------------------
    # SOLIX BATTERY DISCHARGING POWER
    # Returns watts flowing OUT of the battery. Always >= 0.
    #
    # Tier 1: battery_to_home_power + battery_to_grid_power        (ems_second ~5s)
    # Tier 2: max(-(sp − lp − gp), 0)  energy balance estimate     (dynamic_export ~60s)
    # Tier 3: battery_to_home_power + battery_to_grid_power        (ems ~5min)
    # Tier 4: anker own integration                                (anker inte ~5min)
    # --------------------------------------------------------------------------
    - name: "Solix Battery Discharging Power"
      unique_id: solix_battery_discharging_power
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: mdi:battery-arrow-down
      availability: >
        {{
          states('sensor.solix_battery_to_home_power')   not in ['unavailable','unknown','none']
          or states('sensor.solix_battery_to_grid_power') not in ['unavailable','unknown','none']
          or (
               states('sensor.solix_dyn_solar_power')   not in ['unavailable','unknown','none']
               and states('sensor.solix_dyn_home_demand') not in ['unavailable','unknown','none']
               and states('sensor.solix_dyn_grid_power')  not in ['unavailable','unknown','none']
             )
          or states('sensor.solix_ems_battery_to_home_power')   not in ['unavailable','unknown','none']
          or states('sensor.solix_ems_battery_to_grid_power')    not in ['unavailable','unknown','none']
          or states('sensor.x1_h8k_host_discharge_power')    not in ['unavailable','unknown','none']
        }}
      state: >
        # ── Tier 1: ems_second directional flows (~5 s) ──────────────────── #
        {% set b2h_s2 = states('sensor.solix_battery_to_home_power') | float(-1) %}
        {% set b2g_s2 = states('sensor.solix_battery_to_grid_power') | float(-1) %}
        {% set tier1_ok = b2h_s2 >= 0 and b2g_s2 >= 0 %}

        # ── Tier 2: dynamic_export energy balance (~60 s) ───────────────── #
        {% set solar_dyn = states('sensor.solix_dyn_solar_power')  | float(-1) %}
        {% set home_dyn  = states('sensor.solix_dyn_home_demand')  | float(-1) %}
        {% set grid_dyn  = states('sensor.solix_dyn_grid_power')   | float(-999) %}
        {% set tier2_ok  = solar_dyn >= 0 and home_dyn >= 0 and grid_dyn != -999 %}

        # ── Tier 3: ems directional flows (~5 min) ───────────────────────── #
        {% set b2h_ems = states('sensor.solix_ems_battery_to_home_power') | float(-1) %}
        {% set b2g_ems = states('sensor.solix_ems_battery_to_grid_power') | float(-1) %}
        {% set tier3_ok = b2h_ems >= 0 and b2g_ems >= 0 %}

        # ── Tier 4: anker integration (~5 min) ───────────────────────── #
        {% set ank_integration = states('sensor.x1_h8k_host_discharge_power') | float(-1) %}
        {% set tier4_ok = ank_integration >= 0 %}

        # ── Select highest available tier ───────────────────────────────── #
        {% if tier1_ok %}
          {{ (b2h_s2 + b2g_s2) | int(0) }}
        {% elif tier2_ok %}
          {% set balance = solar_dyn - home_dyn - grid_dyn %}
          {{ [balance * -1, 0] | max | int(0) }}
        {% elif tier3_ok %}
          {{ (b2h_ems + b2g_ems) | int(0) }}
        {% elif tier4_ok %}
          {{ ank_integration | float(0) * 1000 }}
        {% else %}
          0
        {% endif %}

    # --------------------------------------------------------------------------
    # BONUS: SOLIX BATTERY NET POWER
    # Signed summary: positive = net charging, negative = net discharging.
    # Derived from the two sensors above — no additional source queries needed.
    # Useful as a single signed sensor for dashboards that expect +/- convention.
    # --------------------------------------------------------------------------
    - name: "Solix Battery Net Power"
      unique_id: solix_battery_net_power
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: mdi:battery-arrow-up-outline
      availability: >
        {{
          states('sensor.solix_battery_charging_power')    not in ['unavailable','unknown','none']
          or states('sensor.solix_battery_discharging_power') not in ['unavailable','unknown','none']
        }}
      state: >
        {% set chg = states('sensor.solix_battery_charging_power')    | float(0) %}
        {% set dch = states('sensor.solix_battery_discharging_power') | float(0) %}
        {{ (chg - dch) | int(0) }}