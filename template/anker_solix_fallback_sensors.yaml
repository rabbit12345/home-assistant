# ==============================================================================
# Solix X1 — Fallback Template Sensors
#
# Each sensor reads from multiple raw MQTT sources in priority order,
# returning the first available value. These are the sensors to use on
# dashboards and in automations instead of the raw ems_second sensors.
#
# Fallback chains:
#   3-tier (ems_second → dynamic_export → ems):
#     battery_soc, battery_power, grid_power, grid_status, home_demand
#   2-tier (ems_second → ems):
#     solar_power, battery_status, plant_status,
#     pv_to_home/battery/grid, battery_to_home/grid, grid_to_home/battery
#
# Requires anker_solix_mqtt_fallback_sources.yaml loaded in mqtt: block.
#
# Add to configuration.yaml:
#   template: !include solix_fallback_sensors.yaml
# ==============================================================================

  - sensor:

    # ==========================================================================
    # GROUP A — 3-tier: ems_second (~5s) → dynamic_export (~60s) → ems (~5min)
    # ==========================================================================
    
    - name: "Solix Grid Export Combined Today"
      unique_id: solix_grid_export_combined_today_kwh
      unit_of_measurement: "Wh"
      device_class: energy
      state_class: total_increasing
      icon: "mdi:transmission-tower-export"
      state: >
        {% set pv = states('sensor.solix_pv_export_today') | float(-1) %}
        {% set bat = states('sensor.solix_daily_grid_discharged_energy') | float(-1) %}
        {% if pv >= 0 and bat >= 0 %}
          {{ pv + bat }}
        {% else %}
          unavailable
        {% endif %}
          
    - name: "Solix Grid Import Combined Today"
      unique_id: solix_grid_import_combined_today_kwh
      unit_of_measurement: "kWh"
      device_class: "energy"
      state_class: "total_increasing"
      icon: "mdi:home-import-outline"
      availability: >
        {{ states('sensor.solix_grid_import_today') not in ['unavailable', 'unknown']
         and states('sensor.solix_grid_charged_today') not in ['unavailable', 'unknown'] }}
      state: >
        {% set import = states('sensor.solix_grid_import_today') | float(0) %}
        {% set charged = states('sensor.solix_grid_charged_today') | float(0) %}
        {{ (import + charged) | round(2) }}
      attributes:
        grid_import_direct_kwh: >
          {% set import = states('sensor.solix_grid_import_today') | float(0) %}
          {{ (import / 1000) | round(2) }}
        grid_import_for_battery_kwh: >
          {% set charged = states('sensor.solix_grid_charged_today') | float(0) %}
          {{ (charged / 1000) | round(2) }}
        import_percentage: >
          {% set import = states('sensor.solix_grid_import_today') | float(0) %}
          {% set charged = states('sensor.solix_grid_charged_today') | float(0) %}
          {% set total = import + charged %}
          {% if total > 0 %}
            {{ ((import / total) * 100) | round(1) }}
          {% else %}
            0
          {% endif %}
        battery_percentage: >
          {% set import = states('sensor.solix_grid_import_today') | float(0) %}
          {% set charged = states('sensor.solix_grid_charged_today') | float(0) %}
          {% set total = import + charged %}
          {% if total > 0 %}
            {{ ((charged / total) * 100) | round(1) }}
          {% else %}
            0
          {% endif %}
    
    - name: "Solix Demand Solar Difference"
      unique_id: solix_demand_solar_difference
      unit_of_measurement: "W"
      state_class: measurement
      device_class: power
      state: >
        {% set demand = states('sensor.solix_home_demand_2') | float(0) %}
        {% set solar = states('sensor.solix_solar_power') | float(0) %}
        {{ (demand - solar) | int(0) }}
        
    - name: "Solix Home Demand"
      unique_id: solix_fb_home_demand
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      icon: mdi:home-lightning-bolt
      state: >
        {% set s2  = states('sensor.solix_home_demand') %}
        {% set dyn = states('sensor.solix_home_demand_dyn') %}
        {% set ems = states('sensor.solix_home_demand_ems') %}
        {% set ank_integration = states('sensor.x1_h8k_host_home_demand') %}
        {% if   s2  not in ['unavailable','unknown','none'] %} {{ s2  | int(0) }}
        {% elif dyn not in ['unavailable','unknown','none'] %} {{ dyn | int(0) }}
        {% elif ems not in ['unavailable','unknown','none'] %} {{ ems | int(0) }}
        {% elif ank_integration not in ['unavailable','unknown','none'] %} {{ ank_integration | float(0) * 1000 }}
        {% else %} 0 {% endif %}
      availability: >
        {{ states('sensor.solix_home_demand')     not in ['none']
        or states('sensor.solix_home_demand_dyn') not in ['none']
        or states('sensor.solix_home_demand_ems') not in ['none'] 
        or states('sensor.x1_h8k_host_home_demand') not in ['none'] }}

