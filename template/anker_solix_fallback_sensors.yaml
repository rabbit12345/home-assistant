        {% elif ems not in ['unavailable','unknown','none'] %} {{ ems | float(0) }}
        {% elif ank_integration not in ['unavailable','unknown','none'] %} {{ ank_integration | float(0) * 1000 }}
        {% else %} 0 {% endif %}
      availability: >
        {{ states('sensor.solix_battery_soc')     not in ['none']
        or states('sensor.solix_battery_soc_dyn') not in ['none']
        or states('sensor.solix_battery_soc_ems') not in ['none'] 
        or states('sensor.x1_h8k_host_state_of_charge') not in ['none'] }}

