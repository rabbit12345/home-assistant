blueprint:
  name: "Light Timer: Activity Hold + Overnight Schedule"
  description: >-
    All-in-one controller for one or more lights. Turns them on when an activity
    sensor fires inside an overnight window that opens at sunset and closes at
    sunrise the next morning, each end shiftable by an offset; holds
    them on with a timer helper that each new activity extends (capped at the
    timer duration), returns them to their prior state - or to a dim level, or
    off - when the timer expires, and sweeps them off when the window closes.
    The lights are never switched on by the schedule itself, only by activity
    inside it.
    Dimmable and non-dimmable lights are handled separately, so a plain on/off
    light is never sent a brightness it cannot use.
    Replaces the usual cluster of separate "turn on at sunset", "brighten on
    motion", "extend timer", "timer expired" and "turn off" automations.
    Requires three helpers per instance, created at
    Settings > Devices & Services > Helpers:
    a Timer (the hold countdown), a Number (hold duration in minutes) and a
    Toggle (enables the timer behaviour). A fourth, optional Toggle switches the
    overnight schedule on; leave it blank to run at any hour.
  domain: automation
  source_url: https://community.home-assistant.io/

  input:

    activity_sensors:
      name: Activity Sensor(s)
      description: >-
        Motion, occupancy or door/contact sensors. Any one going ON brightens the
        light and starts or extends the hold timer.
      selector:
        entity:
          filter:
            domain: binary_sensor
          multiple: true

    light_entity:
      name: Light(s)
      description: >-
        One or more lights to control. All of them are driven together - the same
        brightness, on at sunset, off at the end of the schedule.
      selector:
        entity:
          filter:
            domain: light
          multiple: true

    timer_entity:
      name: Hold Timer Helper
      description: >-
        Helper 1 of 3. The Timer helper this instance owns - the hold countdown.
        Use a unique helper per instance; create at
        Settings > Devices & Services > Helpers > Timer.
        Its own configured duration is irrelevant; this blueprint always starts it
        with the value of the Hold Duration helper below.
      selector:
        entity:
          filter:
            domain: timer

    hold_minutes_helper:
      name: Hold Duration Helper
      description: >-
        Helper 2 of 3. An input_number holding the hold duration in minutes, so it
        can be changed from a dashboard without editing the automation.
        Create at Settings > Devices & Services > Helpers > Number.
        Falls back to 15 minutes if the helper is unavailable.
      selector:
        entity:
          filter:
            domain: input_number

    enable_toggle:
      name: Enable Toggle
      description: >-
        Helper 3 of 3. An input_boolean that enables the timer behaviour. While it
        is off, activity sensors are ignored and the light is left at whatever the
        sunset schedule set. Create at
        Settings > Devices & Services > Helpers > Toggle.
      selector:
        entity:
          filter:
            domain: input_boolean

    extend_seconds:
      name: Extension Per Activity (seconds)
      description: >-
        How much each new activity adds to a running timer. The extension is
        capped so the remaining time never exceeds the Hold Duration - Home
        Assistant rejects any timer change beyond it.
      default: 60
      selector:
        number:
          min: 5
          max: 600
          step: 5
          unit_of_measurement: s
          mode: box

    active_brightness_pct:
      name: Active Brightness (%)
      description: >-
        Brightness for dimmable lights while the hold timer is running.
        Non-dimmable lights are simply switched on.
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    idle_action:
      name: On Timer Expiry
      description: >-
        What to do when the hold timer expires.
        "Restore prior state" puts the lights back exactly as they were just
        before the activity brightened them, including off.
        "Dim to idle brightness" holds them at a low level (front-of-house use).
        "Turn off" switches them off (garage / interior use).
      default: restore
      selector:
        select:
          options:
            - label: Restore prior state
              value: restore
            - label: Dim to idle brightness
              value: dim
            - label: Turn off
              value: "off"

    idle_brightness_pct:
      name: Idle Brightness (%)
      description: >-
        Brightness for dimmable lights after the hold timer expires, when On Timer
        Expiry is "Dim to idle brightness". Not used otherwise.
      default: 20
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    sunset_schedule_toggle:
      name: Overnight Schedule Toggle (optional)
      description: >-
        Optional extra helper: an input_boolean that switches the overnight
        window on. While it is on, activity sensors only act between
        sunset + Window Start Offset and sunrise + Window End Offset the next
        morning, and the lights are swept off when the window closes.
        While it is off there is no window at all and activity sensors run at any
        hour.
        Leave this blank if the instance never needs a window - the two Window
        Offset inputs below are then unused. Create at
        Settings > Devices & Services > Helpers > Toggle.
      default: []
      selector:
        entity:
          filter:
            domain: input_boolean
          multiple: true

    sunset_on_offset:
      name: Window Start Offset (from sunset)
      description: >-
        Time relative to sunset at which the window opens and activity starts
        turning the lights on, as H:MM:SS. Prefix with "-" for before sunset
        (e.g. -0:30:00 opens half an hour early).
      default: "0:00:00"
      selector:
        text:

    sunrise_off_offset:
      name: Window End Offset (from sunrise)
      description: >-
        Time relative to the next sunrise at which the window closes: activity
        stops acting and the lights are swept off. As H:MM:SS, with "-" for
        before sunrise (e.g. -0:30:00 closes half an hour early, 1:00:00 keeps it
        open an hour past sunrise). The window always runs through midnight.
      default: "0:00:00"
      selector:
        text:


variables:
  lights_var: !input light_entity
  timer_var: !input timer_entity
  enable_toggle_var: !input enable_toggle
  hold_minutes_helper_var: !input hold_minutes_helper
  extend_seconds_var: !input extend_seconds
  active_brightness_var: !input active_brightness_pct
  idle_action_var: !input idle_action
  idle_brightness_var: !input idle_brightness_pct
  sunset_schedule_var: !input sunset_schedule_toggle
  sunset_on_offset_var: !input sunset_on_offset
  sunrise_off_offset_var: !input sunrise_off_offset

  # Hold duration in minutes, from the helper. Guards against an unavailable
  # helper and against a 0 that would make timer.start a no-op.
  hold_mins: >-
    {% set m = states(hold_minutes_helper_var) | int(0) %}
    {{ m if m > 0 else 15 }}

  # Split the lights by whether they can take a brightness. A light reporting
  # only onoff (or nothing, when unavailable) is switched plainly instead.
  dimmable_lights: >-
    {% set dim_modes = ['brightness', 'color_temp', 'hs', 'xy',
                        'rgb', 'rgbw', 'rgbww', 'white'] %}
    {% set ns = namespace(out=[]) %}
    {% for l in lights_var %}
      {% if (state_attr(l, 'supported_color_modes') or [])
            | select('in', dim_modes) | list | count > 0 %}
        {% set ns.out = ns.out + [l] %}
      {% endif %}
    {% endfor %}
    {{ ns.out }}

  plain_lights: >-
    {% set dim_modes = ['brightness', 'color_temp', 'hs', 'xy',
                        'rgb', 'rgbw', 'rgbww', 'white'] %}
    {% set ns = namespace(out=[]) %}
    {% for l in lights_var %}
      {% if (state_attr(l, 'supported_color_modes') or [])
            | select('in', dim_modes) | list | count == 0 %}
        {% set ns.out = ns.out + [l] %}
      {% endif %}
    {% endfor %}
    {{ ns.out }}

  # Scene holding the pre-activity state, one per instance, named after the
  # timer helper so two instances can never overwrite each other's snapshot.
  scene_id: "light_timer_restore_{{ timer_var | replace('.', '_') }}"

  # Enable gates.
  enabled: "{{ is_state(enable_toggle_var, 'on') }}"

  # The schedule toggle is optional, so it arrives as a list that is empty when
  # no helper was picked - which means no window at all.
  schedule_on: >-
    {{ sunset_schedule_var | count > 0
       and is_state(sunset_schedule_var[0], 'on') }}

  # Activity window. With no window toggle, or with it off, the window is always
  # open; otherwise it opens at today's sunset + start offset and closes at
  # today's sunrise + end offset, so it wraps through midnight: everything from
  # this evening onwards is inside it, and so is everything up to this morning's
  # close. The single "at or after the open OR before the close" test covers both
  # halves of the night without needing to know which side of midnight we are on.
  # next_setting / next_rising are at most a day ahead, so stepping back 24h from
  # a tomorrow value lands on today's, to within the minute or so that sunset
  # moves per day. That step is taken on the epoch timestamp so it is 24 absolute
  # hours: subtracting timedelta(hours=24) from a zone-aware datetime shifts the
  # wall clock instead, which is an hour wrong on the two DST changeover days
  # (sunset itself only drifts a minute or two, so absolute time is the right
  # thing to hold fixed). The date comparison stays in local time, where "today"
  # is defined.
  in_window: >-
    {% if not schedule_on %}
      {{ true }}
    {% else %}
      {% set on_p = (sunset_on_offset_var | replace('-', '')).split(':') | map('int') | list %}
      {% set on_s = (on_p[0] * 3600 + on_p[1] * 60 + (on_p[2] if on_p | count > 2 else 0))
                    * (-1 if sunset_on_offset_var.startswith('-') else 1) %}
      {% set off_p = (sunrise_off_offset_var | replace('-', '')).split(':') | map('int') | list %}
      {% set off_s = (off_p[0] * 3600 + off_p[1] * 60 + (off_p[2] if off_p | count > 2 else 0))
                     * (-1 if sunrise_off_offset_var.startswith('-') else 1) %}
      {% set next_set = state_attr('sun.sun', 'next_setting') | as_datetime %}
      {% set sunset = next_set | as_local
                      if (next_set | as_local).date() == now().date()
                      else ((next_set | as_timestamp) - 86400) | as_datetime | as_local %}
      {% set next_rise = state_attr('sun.sun', 'next_rising') | as_datetime %}
      {% set sunrise = next_rise | as_local
                       if (next_rise | as_local).date() == now().date()
                       else ((next_rise | as_timestamp) - 86400) | as_datetime | as_local %}
      {{ now() >= sunset + timedelta(seconds=on_s)
         or now() < sunrise + timedelta(seconds=off_s) }}
    {% endif %}


triggers:
  - trigger: state
    entity_id: !input activity_sensors
    to: "on"
    id: activity

  # The timer.finished event, not the state change to idle: timer.cancel also
  # lands on idle, and the window-close branch below cancels the hold. Triggering
  # on the state change meant that cancel queued an expiry run which then ran
  # after the close had turned the lights off - and with the restore action put
  # them straight back on. timer.cancel fires timer.cancelled, so this trigger
  # now sees natural expiry only.
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: !input timer_entity
    id: expired

  - trigger: sun
    event: sunrise
    offset: !input sunrise_off_offset
    id: window_end


conditions: []


actions:
  - choose:

      # Activity: snapshot the lights on the first activity of a hold, brighten
      # them, then start the hold timer or extend a running one.
      - alias: "Activity detected"
        conditions:
          - condition: trigger
            id: activity
          - condition: template
            value_template: "{{ enabled }}"
          - condition: template
            value_template: "{{ in_window }}"
        sequence:
          - variables:
              hold_running: "{{ is_state(timer_var, 'active') }}"

          # Snapshot only when no hold is running, so repeated activity cannot
          # overwrite the pre-activity state with an already-bright one.
          - if:
              - condition: template
                value_template: >-
                  {{ idle_action_var == 'restore' and not hold_running }}
            then:
              - action: scene.create
                data:
                  scene_id: "{{ scene_id }}"
                  snapshot_entities: "{{ lights_var }}"

          - action: light.turn_on
            target:
              entity_id: "{{ dimmable_lights }}"
            data:
              brightness_pct: "{{ active_brightness_var | int(100) }}"

          - action: light.turn_on
            target:
              entity_id: "{{ plain_lights }}"

          - if:
              - condition: template
                value_template: "{{ hold_running }}"
            then:
              # timer.change is rejected if it would push the remaining time past
              # the duration the timer was started with, so add only the headroom
              # that is actually left.
              - variables:
                  extend_by: >-
                    {% set d = (state_attr(timer_var, 'duration') | default('0:00:00', true))
                               .split(':') | map('int') | list %}
                    {% set attr_total = d[0] * 3600 + d[1] * 60 + d[2] %}
                    {% set total = [hold_mins | int * 60, attr_total] | min %}
                    {% set remaining = (state_attr(timer_var, 'finishes_at')
                                        | as_datetime - now()).total_seconds() | round(0) | int %}
                    {{ [extend_seconds_var | int(60), total - remaining] | min }}
              - condition: template
                value_template: "{{ extend_by | int(0) > 0 }}"
              - action: timer.change
                target:
                  entity_id: !input timer_entity
                data:
                  duration: "{{ '00:00:%02d' % (extend_by | int) }}"
            else:
              - action: timer.start
                target:
                  entity_id: !input timer_entity
                data:
                  duration: >-
                    {{ '%02d:%02d:00' % (hold_mins | int // 60, hold_mins | int % 60) }}

      # Hold expired: restore the snapshot, dim back to idle, or turn off.
      # Restoring or dimming outside the schedule window would switch the lights
      # back on, so anything outside the window turns off regardless of the idle
      # action - which covers the schedule toggle going off mid-hold.
      - alias: "Hold timer expired"
        conditions:
          - condition: trigger
            id: expired
        sequence:
          - choose:

              # Restore. The scene is missing after a restart that cleared it,
              # in which case there is no prior state to return to - turn off.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ idle_action_var == 'restore' and in_window
                         and states('scene.' ~ scene_id) not in ['unknown', 'unavailable'] }}
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "scene.{{ scene_id }}"

              - conditions:
                  - condition: template
                    value_template: "{{ idle_action_var == 'dim' and in_window }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ dimmable_lights }}"
                    data:
                      brightness_pct: "{{ idle_brightness_var | int(20) }}"
                  - action: light.turn_on
                    target:
                      entity_id: "{{ plain_lights }}"

            default:
              - action: light.turn_off
                target:
                  entity_id: !input light_entity

      # Window close, at sunrise + end offset: cancel any hold so it cannot go on
      # to expire after the lights have been swept off.
      - alias: "Window close"
        conditions:
          - condition: trigger
            id: window_end
          - condition: template
            value_template: "{{ schedule_on }}"
        sequence:
          - action: timer.cancel
            target:
              entity_id: !input timer_entity
          - action: light.turn_off
            target:
              entity_id: !input light_entity


mode: queued
max: 10
max_exceeded: silent
