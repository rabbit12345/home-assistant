  - variables:
      extend_seconds: '{% set d = state_attr(''timer.frontyard_led_timer'', ''duration'').split('':'')
        | map(''int'') | list %} {% set total = d[0] * 3600 + d[1] * 60 + d[2] %}
        {% set remaining = (state_attr(''timer.frontyard_led_timer'', ''finishes_at'')
        | as_datetime - now()).total_seconds() | round(0) | int %} {{ [60, total -
        remaining] | min }}'
  - condition: template
    value_template: '{{ extend_seconds | int > 0 }}'
  - action: timer.change
    metadata: {}
    data:
      duration: '{{ ''00:00:%02d'' % (extend_seconds | int) }}'
