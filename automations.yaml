- id: '1754809429271'
  alias: Petrol price update - Costco Auburn
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.costco_auburn_p98
  - trigger: time_pattern
    hours: /1
  - trigger: numeric_state
    entity_id:
    - sensor.eei12e_fuel_level
    - sensor.ehd70x_fuel_level
    above: 0
    below: 100
  conditions: []
  actions:
  - action: input_number.set_value
    metadata: {}
    data:
      value: '{{ ''{:.2f}''.format((states.sensor.costco_auburn_p98.state | float(2)
        / 100 * 66 * (100 - states.sensor.eei12e_fuel_level.state | float(2)) / 100.0
        )) }}'
    target:
      entity_id: input_number.petrol_price_to_add_c300
  - action: input_number.set_value
    metadata: {}
    data:
      value: '{{ ''{:.2f}''.format((states.sensor.costco_auburn_p98.state | float(2)
        /100 * 85 * (100 - states.sensor.ehd70x_fuel_level.state | float(2)) / 100.0))
        }}'
    target:
      entity_id: input_number.petrol_price_to_add_gle450
  mode: single
