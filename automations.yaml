- id: '1760763088078'
  alias: Study Light Styrbar Remote
  description: ''
  triggers:
  - trigger: state
    entity_id: event.styrbar_remote_action
    not_from: unavailable
    not_to: unavailable
  actions:
  - choose:
    - conditions:
      - '{{trigger.to_state.attributes.event_type == ''on''}}'
      sequence:
      - data:
          entity_id:
          - light.study_light
          brightness_pct: 50
        action: light.turn_on
    - conditions:
      - '{{trigger.to_state.attributes.button == ''on''}}'
      - '{{trigger.to_state.attributes.event_type == ''hold''}}'
      sequence:
      - data:
          entity_id:
          - light.rose_room_light
          - light.2nd_floor_light
          - light.master_bedroom_light
          brightness_pct: 100
        action: light.turn_on
    - conditions:
      - condition: template
        value_template: '{{trigger.to_state.attributes.button == ''up''}}'
      - condition: template
        value_template: '{{trigger.to_state.attributes.event_type == ''hold''}}'
      sequence:
      - action: mqtt.publish
        metadata: {}
        data:
          topic: zigbee2mqtt/Bedroom/set
          payload: '{"brightness_move": 50 }'
    - conditions:
      - condition: template
        value_template: '{{trigger.to_state.attributes.button == ''down''}}'
      - condition: template
        value_template: '{{trigger.to_state.attributes.event_type == ''hold''}}'
      sequence:
      - action: mqtt.publish
        metadata: {}
        data:
          topic: zigbee2mqtt/Bedroom/set
          payload: '{"brightness_move": -50 }'
    - conditions:
      - condition: template
        value_template: '{{trigger.to_state.attributes.button in (''up'', ''down'')}}'
      - condition: template
        value_template: '{{trigger.to_state.attributes.event_type == ''hold_release''}}'
      sequence:
      - action: mqtt.publish
        metadata: {}
        data:
          topic: zigbee2mqtt/Bedroom/set
          payload: '{"brightness_move": 0 }'
    - conditions:
      - condition: template
        value_template: '{{trigger.to_state.attributes.event_type == ''off''}}'
      sequence:
      - data:
          entity_id:
          - light.study_light
        action: light.turn_off
    - conditions:
      - condition: template
        value_template: '{{trigger.to_state.attributes.button == ''off''}}'
      - condition: template
        value_template: '{{trigger.to_state.attributes.event_type == ''hold''}}'
      sequence:
      - data:
          entity_id:
          - light.rose_room_light
          - light.2nd_floor_light
          - light.master_bedroom_light
        action: light.turn_off
  initial_state: 'on'
  mode: queued
  max_exceeded: silent
