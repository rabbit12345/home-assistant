- id: '1784258040710'
  alias: Front Gate Open - Sonos Audio Notification
  description: Plays a pre-recorded audio clip on Sonos when a door opens
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.frontgate_sensor_door
    from: 'off'
    to: 'on'
  actions:
  - action: sonos.snapshot
    target:
      entity_id: '{{ sonos_speaker }}'
    data:
      with_group: true
  - action: media_player.volume_set
    target:
      entity_id:
      - media_player.sonos_beam
    data:
      volume_level: 0.4
  - action: media_player.volume_set
    target:
      entity_id:
      - media_player.sonos_arc_ultra
    data:
      volume_level: 0.4
  - action: media_player.play_media
    target:
      entity_id: '{{ sonos_speaker }}'
    data:
      media:
        media_content_id: media-source://media_source/local/friendly-doorbell.mp3
        media_content_type: audio/mpeg
        metadata:
          title: doorbell_door_opened_nana.mp3
          thumbnail:
          media_class: music
          children_media_class:
          navigateIds:
          - {}
          - media_content_type: app
            media_content_id: media-source://media_source
          browse_entity_id: media_player.sonos_arc_ultra
      extra:
        volume: 20
      enqueue: replace
  - delay:
      seconds: 3
  - action: sonos.restore
    target:
      entity_id: '{{ sonos_speaker }}'
    data:
      with_group: true
  variables:
    sonos_speaker:
    - media_player.sonos_beam
    - media_player.sonos_arc_ultra
    notification_volume: 0.4
    audio_clip: /local/audio/doorbell_door_opened_nana.mp3
  mode: single
- id: '1784362112998'
  alias: Door Open - Generic Random Sonos Notification
  description: Plays a random clip from the folder matching the triggered sensor
  triggers:
  - trigger: state
    entity_id: binary_sensor.front_door_sensor
    from: 'off'
    to: 'on'
    id: front_door
  - trigger: state
    entity_id: binary_sensor.frontgate_sensor_door
    from: 'off'
    to: 'on'
    id: front_gate
  - trigger: state
    entity_id: binary_sensor.garden_door_sensor_door
    from: 'off'
    to: 'on'
    id: garden_door
  - trigger: state
    entity_id: binary_sensor.kitchen_door_sensor_door
    from: 'off'
    to: 'on'
    id: kitchen_door
  - trigger: state
    entity_id:
    - binary_sensor.walkway_ms600_occupancy
    from:
    - 'off'
    to:
    - 'on'
    id: walkway
  actions:
  - variables:
      audio_folder_sensor: '{{ folder_sensors[trigger.id] }}'
      media_folder: '{{ trigger.id }}'
  - variables:
      file_list: '{{ state_attr(audio_folder_sensor, ''file_list'') | default([],
        true) }}

        '
  - if:
    - condition: template
      value_template: '{{ file_list | length == 0 }}'
    then:
    - action: system_log.write
      data:
        level: warning
        logger: door_sonos_notification
        message: 'No clips for {{ trigger.id }} - {{ audio_folder_sensor }} missing
          or /media/{{ media_folder }} has no *.mp3

          '
    - stop: No audio files available
  - variables:
      random_file: '{{ file_list | random }}'
      audio_clip: 'media-source://media_source/local/{{ media_folder }}/{{ random_file.split(''/'')[-1]
        }}

        '
  - action: sonos.snapshot
    target:
      entity_id: '{{ sonos_speaker }}'
    data:
      with_group: true
  - action: media_player.volume_set
    target:
      entity_id: '{{ sonos_speaker }}'
    data:
      volume_level: '{{ notification_volume }}'
  - action: media_player.play_media
    target:
      entity_id: '{{ sonos_speaker }}'
    data:
      enqueue: replace
      media:
        media_content_id: '{{ audio_clip }}'
        media_content_type: music
        metadata: {}
  - wait_template: '{{ is_state(sonos_speaker[0], ''playing'') }}'
    timeout: 00:00:02
    continue_on_timeout: true
  - wait_template: '{{ not is_state(sonos_speaker[0], ''playing'') }}'
    timeout: 00:00:05
    continue_on_timeout: true
  - action: sonos.restore
    target:
      entity_id: '{{ sonos_speaker }}'
    data:
      with_group: true
  variables:
    sonos_speaker:
    - media_player.sonos_beam
    - media_player.sonos_arc_ultra
    notification_volume: 0.4
    folder_sensors:
      front_door: sensor.front_door
      front_gate: sensor.front_gate
      garden_door: sensor.garden_door
      kitchen_door: sensor.kitchen_door
      walkway: sensor.walkway
  mode: single
  max_exceeded: silent
