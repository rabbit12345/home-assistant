- id: '1772774893084'
  alias: Styrbar Remote Control for Study Lights
  description: ''
  triggers:
  - device_id: cd848a745352a2d5ad5fdffb6febeb6a
    domain: mqtt
    type: action
    subtype: 'on'
    id: light_on
    trigger: device
  - device_id: cd848a745352a2d5ad5fdffb6febeb6a
    domain: mqtt
    type: action
    subtype: 'off'
    id: light_off
    trigger: device
  - device_id: cd848a745352a2d5ad5fdffb6febeb6a
    domain: mqtt
    type: action
    subtype: arrow_left_click
    id: change_color_left
    trigger: device
  - device_id: cd848a745352a2d5ad5fdffb6febeb6a
    domain: mqtt
    type: action
    subtype: arrow_left_hold
    id: change_color_left_hold
    trigger: device
  - device_id: cd848a745352a2d5ad5fdffb6febeb6a
    domain: mqtt
    type: action
    subtype: arrow_left_release
    id: change_color_left_release
    trigger: device
  - device_id: cd848a745352a2d5ad5fdffb6febeb6a
    domain: mqtt
    type: action
    subtype: arrow_right_click
    id: change_color_right
    trigger: device
  - device_id: cd848a745352a2d5ad5fdffb6febeb6a
    domain: mqtt
    type: action
    subtype: arrow_right_hold
    id: change_color_right_hold
    trigger: device
  - device_id: cd848a745352a2d5ad5fdffb6febeb6a
    domain: mqtt
    type: action
    subtype: arrow_right_release
    id: change_color_right_release
    trigger: device
  - device_id: cd848a745352a2d5ad5fdffb6febeb6a
    domain: mqtt
    type: action
    subtype: brightness_move_down
    id: dim_down
    trigger: device
  - device_id: cd848a745352a2d5ad5fdffb6febeb6a
    domain: mqtt
    type: action
    subtype: brightness_move_up
    id: dim_up
    trigger: device
  - device_id: cd848a745352a2d5ad5fdffb6febeb6a
    domain: mqtt
    type: action
    subtype: brightness_stop
    id: dim_stop
    trigger: device
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: light_on
      sequence:
      - target:
          entity_id: light.study_light
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: light_off
      sequence:
      - target:
          entity_id: light.study_light
        action: light.turn_off
    - conditions:
      - condition: trigger
        id: change_color_left_hold
      sequence:
      - repeat:
          sequence:
          - target:
              entity_id: light.study_light
            data:
              color_temp_kelvin: '{{ state_attr(light_entity, ''color_temp_kelvin'')
                - 100 }}'
            action: light.turn_on
          - delay:
              milliseconds: 300
          until:
          - condition: trigger
            id: change_color_left_release
    - conditions:
      - condition: trigger
        id: change_color_right_hold
      sequence:
      - repeat:
          sequence:
          - target:
              entity_id: light.study_light
            data:
              color_temp_kelvin: '{{ state_attr(light_entity, ''color_temp_kelvin'')
                + 100 }}'
            action: light.turn_on
          - delay:
              milliseconds: 300
          until:
          - condition: trigger
            id: change_color_right_release
    - conditions:
      - condition: trigger
        id: change_color_left
      sequence:
      - repeat:
          sequence:
          - target:
              entity_id: light.study_light
            data:
              brightness_step_pct: -{{ brightness_step | int(5) }}
              transition: 1
            action: light.turn_on
          - delay:
              milliseconds: 300
          until:
          - condition: trigger
            id: dim_stop
    - conditions:
      - condition: trigger
        id: change_color_right
      sequence:
      - repeat:
          sequence:
          - target:
              entity_id: light.study_light
            data:
              brightness_step_pct: '{{ brightness_step | int(5) }}'
              transition: 1
            action: light.turn_on
          - delay:
              milliseconds: 300
          until:
